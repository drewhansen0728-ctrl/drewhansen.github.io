<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>My Texas Planner</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f7f5f2}#planner{border:0;width:100%;height:100vh;display:block}</style></head><body><iframe id="planner" src="app.html" title="My Texas Planner"></iframe><script>const frame=document.getElementById('planner');frame.addEventListener('load',async()=>{try{for(const file of ['planner-update.js?v=4','color-update.js?v=2','event-editor.js?v=1','notes-dashboard-v2.js?v=1','dashboard-aesthetic-v3.js?v=1']){const code=await fetch(file,{cache:'no-store'}).then(r=>r.text());frame.contentWindow.eval(code)}}catch(err){console.error('Planner enhancement failed to load',err)}});</script></body></html>
